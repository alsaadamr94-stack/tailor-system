<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مِقياس — نظام إدارة محل الخياطة الرجالية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#171A21',
          canvas: '#EEE9DD',
          panel:  '#FFFFFF',
          brass:  '#9C7A2E',
          brassd: '#7C6224',
          thread: '#8A3324',
          sage:   '#3F5A46',
          line:   '#DCD3BD',
          muted:  '#8A8371',
        },
        fontFamily: {
          display: ['Almarai', 'sans-serif'],
          body: ['Tajawal', 'sans-serif'],
        },
      },
    },
  };
</script>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { font-family: 'Tajawal', sans-serif; background: #EEE9DD; }
  .font-display { font-family: 'Almarai', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #DCD3BD; border-radius: 4px; }
  .stitch-divider {
    height: 1px;
    background-image: repeating-linear-gradient(90deg, #B8AE93 0 6px, transparent 6px 12px);
  }
  @keyframes riseIn { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  .rise-in { animation: riseIn .35s ease-out; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; top: 0; right: 0; width: 100%; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body class="text-ink">
  <div id="root"></div>

  <script type="text/babel" src="app.js"></script>
</body>
</html>
